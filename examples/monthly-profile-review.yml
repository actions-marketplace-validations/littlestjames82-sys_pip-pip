# Monthly profile review: refresh the PIP section of your GitHub profile
# README on the 1st of every month, hands-free.
#
# Setup: create a profile repository (a repo named exactly like your
# username, with a README.md), copy this file to
# .github/workflows/monthly-pip-review.yml in it, and commit. The Action
# reviews the profile repo itself; point the `repo` input at any repo you
# want reviewed instead.
name: Monthly PIP review

on:
  schedule:
    - cron: "0 9 1 * *"   # 09:00 UTC on the 1st of each month
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # PIP reads history; a shallow clone reviews a rumor
      - uses: littlestjames82-sys/pip-pip@main
        with:
          repo: .
      - name: Commit the refreshed review
        run: |
          if ! git diff --quiet README.md pip-card.svg pip-badge.svg; then
            git config user.name "pip-bot"
            git config user.email "pip-bot@example.invalid"
            git add README.md pip-card.svg pip-badge.svg
            git commit -m "Monthly PIP review refresh"
            git push
          fi
