# Monthly profile review: refresh the PIP section of your GitHub profile
# README on the 1st of every month, hands-free.
#
# Setup: create a profile repository (a repo named exactly like your
# username, with a README.md), copy this file to
# .github/workflows/monthly-pip-review.yml in it, and commit. The Action
# reviews the repository it runs in (it has no `repo` input), and it
# commits and pushes the refreshed card itself, so this workflow needs
# no commit step of its own.
name: Monthly PIP review

on:
  schedule:
    - cron: "0 9 1 * *"   # 09:00 UTC on the 1st of each month
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # PIP reads history; a shallow clone reviews a rumor
      - uses: littlestjames82-sys/pip-pip@v1
        with:
          persona: corporate
          # author: "your name"   # omit to review the most prolific author
