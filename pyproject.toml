[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "on-a-pip"
version = "0.5.1"
description = "PIP: your AI puts YOU on a Performance Improvement Plan. A local, private review of the programmer, generated from their own git history."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Ryan Cotten", email = "hello@ghostdeveloperstudio.com" }]
keywords = ["git", "performance-review", "developer-tools", "fun", "report-card"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Version Control :: Git",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/littlestjames82-sys/pip-pip"
Repository = "https://github.com/littlestjames82-sys/pip-pip"

[project.scripts]
on-a-pip = "pip_pip:main"
pip-pip = "pip_pip:main"

[tool.setuptools]
py-modules = ["pip_pip"]
